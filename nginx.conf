events {
    worker_connections 1024;
}

http {
    # Upstream definitions for backend and frontend
    upstream backend {
        server backend:5000;   # backend container name and internal port
    }

    upstream frontend {
        server frontend:80;     # frontend container name and internal port
    }

    server {
        listen 80;
        server_name _;           # Replace with your domain if you have one

        # Serve frontend static files
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy API requests to backend
        location /api/ {
            proxy_pass http://backend/;   # Trailing slash removes /api prefix
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}