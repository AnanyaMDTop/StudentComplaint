version: '3.8'

services:
  # MongoDB database
  db:
    image: mongo:latest
    container_name: hostelops-db
    volumes:
      - mongo-data:/data/db
    networks:
      - hostelops-net
    restart: unless-stopped
    # No ports exposed to host – internal only
    expose:
      - "27017"

  # Backend API (Node.js/Express)
  backend:
    build: ./backend
    container_name: hostelops-backend
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://db:27017/hostelops
      - JWT_SECRET=${JWT_SECRET}   # Read from .env file or host environment
    depends_on:
      - db
    networks:
      - hostelops-net
    restart: unless-stopped
    expose:
      - "5000"   # Internal only

  # Frontend (React app served by Nginx)
  frontend:
    build: ./frontend
    container_name: hostelops-frontend
    networks:
      - hostelops-net
    restart: unless-stopped
    expose:
      - "80"    # Internal only – serves static files

  # Reverse proxy (Nginx) – public entry point
  nginx:
    image: nginx:alpine
    container_name: hostelops-proxy
    ports:
      - "80:80"                     # Public access via host port 80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - hostelops-net
    restart: unless-stopped

volumes:
  mongo-data:

networks:
  hostelops-net:
    driver: bridge