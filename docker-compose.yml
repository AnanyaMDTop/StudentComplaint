version: '3.8'

services:
  db:
    image: mongo:latest
    container_name: hostelops-db
    volumes:
      - mongo-data:/data/db
    networks:
      - hostelops-net
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: hostelops-backend
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://db:27017/hostelops
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - db
    networks:
      - hostelops-net
    restart: unless-stopped
    expose:
      - "5000"

  frontend:
    build: ./frontend
    container_name: hostelops-frontend
    networks:
      - hostelops-net
    restart: unless-stopped
    ports:
      - "80:80"

networks:
  hostelops-net:
    driver: bridge

volumes:
  mongo-data: