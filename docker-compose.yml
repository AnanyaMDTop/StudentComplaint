services:
  # ------------------- MongoDB -------------------
  db:
    image: mongo:latest
    container_name: hostelops-db
    volumes:
      - mongo-data:/data/db
    networks:
      - hostelops-net
    restart: unless-stopped

  # ------------------- Backend -------------------
  backend:
    build: ./backend
    container_name: hostelops-backend
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://db:27017/hostelops
      - JWT_SECRET=your-super-secret-key-change-in-production
    depends_on:
      - db
    networks:
      - hostelops-net
    restart: unless-stopped
    expose:
      - "5000"
    # REMOVED healthcheck - it was failing

  # ------------------- Frontend -------------------
  frontend:
    build: ./frontend
    container_name: hostelops-frontend
    networks:
      - hostelops-net
    restart: unless-stopped

  # ------------------- Nginx Reverse Proxy -------------------
  proxy:
    image: nginx:alpine
    container_name: hostelops-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend-build:/var/www/html:ro
    networks:
      - hostelops-net
    depends_on:
      - backend
      - frontend

# ------------------- Networks -------------------
networks:
  hostelops-net:
    driver: bridge

# ------------------- Volumes -------------------
volumes:
  mongo-data:
  frontend-build:
