version: '3.8'

services:
  db:
    image: mongo:latest
    container_name: hostelops-db
    volumes:
      - mongo-data:/data/db
    networks:
      - hostelops-net
    restart: unless-stopped
    ports:
      - "27017:27017"   # Now accessible from outside

  backend:
    build: ./backend
    container_name: hostelops-backend
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://db:27017/hostelops
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - db
    networks:
      - hostelops-net
    restart: unless-stopped
    expose:
      - "5000"

  frontend:
    build: ./frontend
    container_name: hostelops-frontend
    networks:
      - hostelops-net
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: hostelops-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - hostelops-net
    restart: unless-stopped

volumes:
  mongo-data:

networks:
  hostelops-net:
    driver: bridge