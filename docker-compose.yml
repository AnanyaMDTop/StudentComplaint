version: '3.8'

services:
  # ------------------- MongoDB -------------------
  db:
    image: mongo:latest
    container_name: hostelops-db
    volumes:
      - mongo-data:/data/db
    networks:
      - hostelops-net
    restart: unless-stopped

  # ------------------- Backend -------------------
  backend:
    build: ./backend
    container_name: hostelops-backend
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://db:27017/hostelops
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - db
    networks:
      - hostelops-net
    restart: unless-stopped
    expose:
      - "5000"

  # ------------------- Frontend -------------------
  frontend:
    build: ./frontend
    container_name: hostelops-frontend
    networks:
      - hostelops-net
    restart: unless-stopped
    expose:
      - "80"

  # ------------------- Nginx Reverse Proxy -------------------
  proxy:
    image: nginx:alpine
    container_name: hostelops-proxy
    restart: unless-stopped
    ports:
      - "80:80"      # public HTTP
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - hostelops-net
    depends_on:
      - backend
      - frontend

# ------------------- Networks -------------------
networks:
  hostelops-net:
    driver: bridge

# ------------------- Volumes -------------------
volumes:
  mongo-data: