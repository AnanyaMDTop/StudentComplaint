version: '3.8'

services:
  # ------------------- MongoDB -------------------
  db:
    image: mongo:latest
    container_name: hostelops-db
    volumes:
      - mongo-data:/data/db
    networks:
      - hostelops-net
    restart: unless-stopped

  # ------------------- Backend -------------------
  backend:
    build: ./backend
    container_name: hostelops-backend
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://db:27017/hostelops
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - db
    networks:
      - hostelops-net
    restart: unless-stopped
    expose:
      - "5000"
    healthcheck:  # Optional: better dependency handling
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ------------------- Frontend -------------------
  frontend:
    build: ./frontend
    container_name: hostelops-frontend
    networks:
      - hostelops-net
    restart: unless-stopped

  # ------------------- Nginx Reverse Proxy -------------------
  proxy:
    image: nginx:alpine
    container_name: hostelops-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend-build:/var/www/html:ro  # Mount frontend build output
    networks:
      - hostelops-net
    depends_on:
      backend:
        condition: service_healthy  # Wait for backend
      frontend:
        condition: service_completed_successfully  # Or service_started

# ------------------- Networks -------------------
networks:
  hostelops-net:
    driver: bridge

# ------------------- Volumes -------------------
volumes:
  mongo-data:
  frontend-build:  # Named volume for frontend static files
