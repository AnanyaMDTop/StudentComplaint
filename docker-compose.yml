services:
  db:
    image: mongo:latest
    container_name: hostelops-db
    volumes:
      - mongo-data:/data/db
    networks:
      - hostelops-net
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: hostelops-backend
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://db:27017/hostelops
      - JWT_SECRET=supersecret123
    networks:
      - hostelops-net
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: hostelops-frontend
    networks:
      - hostelops-net
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    container_name: hostelops-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - hostelops-net
    depends_on:
      - frontend
      - backend

networks:
  hostelops-net:

volumes:
  mongo-data:
