services:
  db:
    image: mongo:latest
    container_name: hostelops-db
    volumes:
      - mongo-data:/data/db
    networks:
      - hostelops-net
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: hostelops-backend
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://db:27017/hostelops
      - JWT_SECRET=supersecret123
    depends_on:
      - db
    networks:
      - hostelops-net
    restart: unless-stopped
    expose:
      - "5000"

  frontend:
    build: ./frontend
    container_name: hostelops-frontend
    ports:                           # Expose frontend directly
      - "80:80"
    networks:
      - hostelops-net
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    container_name: hostelops-proxy
    restart: unless-stopped
    ports:
      - "8080:80"                    # Use different port
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - hostelops-net
    depends_on:
      - backend
      - frontend
