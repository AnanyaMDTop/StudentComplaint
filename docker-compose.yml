services:
  db:
    image: mongo:latest
    container_name: hostelops-db
    volumes:
      - mongo-data:/data/db
    networks:
      - hostelops-net
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: hostelops-backend
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://db:27017/hostelops
      - JWT_SECRET=supersecret123
    depends_on:
      - db
    networks:
      - hostelops-net
    restart: unless-stopped
    expose:
      - "5000"  # Internal only

  frontend:
    build: ./frontend
    container_name: hostelops-frontend
    networks:
      - hostelops-net
    restart: unless-stopped
    # NO ports - internal only

  proxy:  # ← THIS serves everything on port 80
    image: nginx:alpine
    container_name: hostelops-proxy
    ports:
      - "80:80"     # ← SINGLE PORT 80 for everything
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro  # Single config
    networks:
      - hostelops-net
    depends_on:
      - backend
      - frontend

networks:
  hostelops-net:
    driver: bridge

volumes:
  mongo-data:
